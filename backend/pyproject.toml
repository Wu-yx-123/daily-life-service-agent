# 作用：声明后端 Python 包、运行依赖和 pytest 配置。
[project]
name = "massageops-agent-backend"
version = "0.1.0"
description = "Phase 1 MVP backend for MassageOps-Agent"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.111.0",
  "greenlet>=3.0.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "openai>=1.50.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "python-dateutil>=2.9.0",
  "python-dotenv>=1.0.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.30",
  "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
